services:
  - type: web
    name: procheck-issue-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start_render.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_BACKEND
        value: sqlite
      - key: PROCHECK_DEMO_READ_ONLY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
