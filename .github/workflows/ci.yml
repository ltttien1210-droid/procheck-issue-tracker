name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --fail-under=80
      - run: coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
  sql-server:
    runs-on: ubuntu-latest
    env:
      MSSQL_SA_PASSWORD: "CI-SqlOnly-Test!8723"
      SECRET_KEY: "ci-only-configuration-key-00123456789"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d db
      - run: docker compose build app
      - run: docker compose run --rm app python scripts/mssql_bootstrap.py python -m unittest discover -s tests -p mssql_smoke.py -v
      - if: failure()
        run: docker compose logs --no-color db
      - if: always()
        run: docker compose down -v
